  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal, .reveal-stagger, .divider-line').forEach(el => io.observe(el));
        window.addEventListener('scroll', () => {
          document.querySelectorAll('nav, header nav').forEach(n => n.classList.toggle('nav-scrolled', window.scrollY > 40));
        });
      });
    </script>
  </body>
